<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T Festival Ticketing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen" style="background-color: #fef8e8">
    <nav class="bg-blue-600 text-white p-4 shadow-md">
      <div class="container mx-auto flex item-center">
        <h1 class="text-2xl font-bold flex item-center">T Festival</h1>
      </div>
    </nav>

    <main class="flex-grow container mx-auto px-6">
        <form id="ticketForm" class="bg-white shadow-md rounded p-6 w-full mx-w-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">Add Ticket</h2>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <input  type="text" placeholder="firstName" required class="border p-3 rounded w-full" id="firstName">
                <input  type="text" placeholder="lastName" required class="border p-3 rounded w-full" id="lastName">
            </div>

            <div class="mb-4">
                <input type="email" placeholder="Enter your Email" id="email" required class="border p-3 rounded w-full">

            </div>
            <div class="mb-4">
                <input type="number" placeholder="Number of Tickets" id="ticketCount" required min="1" class="border p-2 rounded w-full">
            </div>

        </form>

    </main>

    

    <script src="style.js"></script>
  </body>
</html>
